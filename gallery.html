<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery – 7 Newton</title>
  <link rel="stylesheet" href="css/indexstyle.css">
  <link rel="stylesheet" href="css/gallerystyle.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">
      <img src="images/logo.jpg" alt="7 Newton Logo">
      <h1>Newton</h1>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="students.html">Our Class</a>
      <a href="gallery.html">Gallery</a>
      <a href="events.html">Events</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <!-- Gallery Section -->
  <section class="gallery-container">
    <h1 class="gallery-title">📸 Class Gallery</h1>

    <!-- Search + iOS-style Sorting -->
    <div class="gallery-controls">
      <input type="text" id="search" placeholder="🔍 Search photos...">
      <div class="segmented-control">
        <button class="seg-btn active" data-sort="newest">Newest</button>
        <button class="seg-btn" data-sort="oldest">Oldest</button>
      </div>
    </div>

    <!-- Gallery Sections (will be filled by JS) -->
    <div id="gallerySections"></div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; <span id="year"></span> 7 Newton – Singapore International School Tashkent</p>
  </footer>

  <!-- Scripts -->
  <script src="js/script.js"></script>
  <script src="js/galleryscript.js"></script>
</body>
</html>
